<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Participation - Hong Kong</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--card:#fff;--accent:#D81B45;--shadow:0 2px 6px rgba(0,0,0,.04),0 14px 34px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:auto;padding:20px 24px 42px}
.hero{display:flex;justify-content:space-between;gap:28px;align-items:center;margin:0 -8px 24px;padding:30px 34px 28px;background:linear-gradient(135deg,#111827 0%,#5B1732 58%,#D81B45 100%);border-radius:0 0 24px 24px;box-shadow:0 18px 48px rgba(17,24,39,.18);min-height:158px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.72);text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(34px,4.2vw,58px);font-weight:800;color:#fff;line-height:.98;margin:0 0 10px;letter-spacing:-.055em}.sub{color:#FBCFE8;margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;max-width:760px}
.hint,.hero-print-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px;white-space:nowrap;backdrop-filter:blur(8px)}.hero-print-btn{cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(430px,520px) 1fr;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);background:#F9FAFB}.panel-head h2{margin:0;font-size:20px;letter-spacing:-.02em}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}th{background:#F9FAFB;color:#4B5563;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:12px 13px;border-bottom:1px solid var(--line)}td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#F9FAFB}tbody tr.active{background:#FDECEF;box-shadow:inset 5px 0 0 var(--accent)}tbody tr.active .agency-cell:before{content:'✓';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;font-family:'IBM Plex Mono';font-size:11px;margin-right:2px}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}.agency-cell{display:flex;align-items:center;gap:10px;font-weight:800}.dot{width:8px;height:28px;border-radius:999px;border:1px solid rgba(0,0,0,.12);display:inline-block;flex:0 0 auto}.dot.big{width:10px;height:42px}.group{display:block;color:var(--muted);font-family:'IBM Plex Mono';font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}.num{font-weight:900;font-size:25px;letter-spacing:-.03em}.year-cell{font-family:'IBM Plex Mono';font-weight:700;color:#4B5563}.chev{color:var(--muted);font-family:'IBM Plex Mono'}
.detail{display:none}.detail.active{display:block}.detail-hero{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(180deg,#fff,#F8FAFC)}.detail-title{display:flex;align-items:center;gap:14px}.detail-title h3{font-size:33px;line-height:1;margin:0;letter-spacing:-.035em}.detail-title small{display:block;margin-top:4px;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.detail-count{text-align:right}.detail-count b{display:block;font-size:58px;line-height:.85;letter-spacing:-.06em}.detail-count span{font-size:12px;color:var(--muted)}
.year-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:#FCFCFD}.year-box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.year-box span{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.year-box b{display:block;font-size:24px;line-height:1;margin-top:3px}
.detail-body{display:grid;grid-template-columns:1fr 1fr;gap:0}.pitch-section{padding:18px 22px 24px}.pitch-section+.pitch-section{border-left:1px solid var(--line)}.pitch-section h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono';color:#4B5563}.pitch-list{display:flex;flex-wrap:wrap;gap:8px}.pitch-chip{border:1px solid #E5E7EB;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:650;color:#111827}.pitch-chip.loss{background:#FFF7F8;color:#8B1D3B;border-color:#F5C2D0}.pitch-chip.ret{background:#F8FAFC;color:#374151}.empty{display:none;padding:36px 22px;text-align:center;color:var(--muted)}.empty.active{display:block}
@media(max-width:1080px){.layout{grid-template-columns:1fr}.hero{display:block;padding:30px 24px 28px}.hint{display:inline-block;margin-top:16px}.detail-body{grid-template-columns:1fr}.pitch-section+.pitch-section{border-left:0;border-top:1px solid var(--line)}}
@media print{.hint,.hero-print-btn{display:none}.layout{display:block}.panel{box-shadow:none;margin-bottom:14px}.detail{display:block!important;break-inside:avoid}.empty{display:none!important}tr{break-inside:avoid}@page{size:A4 landscape;margin:12mm}}
</style>
<style id="vitality-green-theme">:root{--accent:#16A34A}.hero,.report-hero{background:linear-gradient(135deg,#0F2A1C 0%,#166534 62%,#16A34A 100%)!important}.sub,.report-sub{color:#DCFCE7!important}tbody tr.active{background:#F0FDF4!important}</style>
</head>
<body>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">

      <div class="hint">Click agencies to select / deselect</div>

    <div class="panel" id="pitchDetails"></div>

</main>

const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

<tr class="${item.active?'active':''}" data-target="${esc(item.id)}">

(function(){
  const layout=document.querySelector('.report-interactive');
  const rows=[...layout.querySelectorAll('tbody tr[data-target]')];
  const details=[...layout.querySelectorAll('.detail[id]')];
  const empty=layout.querySelector('.empty');
  function sync(){
    const active=rows.filter(r=>r.classList.contains('active')).map(r=>r.dataset.target);
    details.forEach(d=>d.classList.toggle('active',active.includes(d.id)));
    if(empty)empty.classList.toggle('active',active.length===0);
  }
  rows.forEach(row=>row.addEventListener('click',()=>{row.classList.toggle('active');sync();}));
  sync();
}());
</script>
