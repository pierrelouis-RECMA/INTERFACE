<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Management - Hong Kong</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--accent:#D81B45;--shadow:0 2px 6px rgba(0,0,0,.04),0 14px 34px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);font-size:14px;line-height:1.5}.wrap{max-width:1400px;margin:auto;padding:20px 24px 42px}.hero{display:flex;justify-content:space-between;gap:28px;align-items:center;margin:0 -8px 24px;padding:30px 34px 28px;background:linear-gradient(135deg,#111827 0%,#5B1732 58%,#D81B45 100%);border-radius:0 0 24px 24px;box-shadow:0 18px 48px rgba(17,24,39,.18);min-height:158px}.kicker{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.72);text-transform:uppercase;margin-bottom:10px}h1{font-size:clamp(34px,4.2vw,58px);font-weight:800;color:#fff;line-height:.98;margin:0 0 10px}.sub{color:#FBCFE8;margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px}.hint,.hero-print-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px;white-space:nowrap}.hero-print-btn{cursor:pointer}.layout{display:grid;grid-template-columns:minmax(430px,520px) 1fr;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);background:#F9FAFB}.panel-head h2{margin:0;font-size:20px}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th{background:#F9FAFB;color:#4B5563;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:12px 13px;border-bottom:1px solid var(--line)}td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#F9FAFB}tbody tr.active{background:#FDECEF;box-shadow:inset 5px 0 0 var(--accent)}tbody tr.active .agency-cell:before{content:'✓';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;font-family:'IBM Plex Mono';font-size:11px;margin-right:2px}th:nth-child(n+3),td:nth-child(n+3){text-align:right}.agency-cell{display:flex;align-items:center;gap:10px;font-weight:800}.dot{width:8px;height:28px;border-radius:999px;border:1px solid rgba(0,0,0,.12);display:inline-block;flex:0 0 auto}.dot.big{width:10px;height:42px}.group{display:block;color:var(--muted);font-family:'IBM Plex Mono';font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}.num{font-weight:900;font-size:25px}.pts{display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:42px;padding:0 10px;border-radius:999px;font-family:'IBM Plex Mono';font-size:12px;font-weight:700;white-space:nowrap}.pts.mid{background:#DBEAFE;color:#1E3A8A}.pts.none{background:#F3F0E8;color:#8A8578}.chev{color:var(--muted);font-family:'IBM Plex Mono'}.detail{display:none}.detail.active{display:block}.detail-hero{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(180deg,#fff,#F8FAFC)}.detail-title{display:flex;align-items:center;gap:14px}.detail-title h3{font-size:33px;line-height:1;margin:0}.detail-title small{display:block;margin-top:4px;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.detail-count{text-align:right}.detail-count b{display:block;font-size:52px;line-height:.9}.detail-count span{font-size:12px;color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:#FCFCFD}.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.fact span{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.fact b{display:block;font-size:22px;line-height:1;margin-top:3px}.people{padding:18px 24px;background:#fff}.people h4{margin:0 0 10px;font-size:15px}.people-list{display:grid;gap:8px}.person{display:grid;grid-template-columns:minmax(130px,1.05fr) minmax(180px,1.45fr) minmax(92px,.65fr) minmax(120px,.8fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FCFCFD}.person b{font-size:13px}.person span{color:#4B5563;font-size:12px}.person em{font-style:normal;color:#6B7280;font-size:12px}.pdf-note{padding:14px 24px;color:#6B7280;font-size:12px;border-bottom:1px solid var(--line);background:#fff}.empty{display:none;padding:36px 22px;text-align:center;color:var(--muted)}.empty.active{display:block}@media(max-width:1080px){.layout{grid-template-columns:1fr}.hero{display:block;padding:30px 24px 28px}.hint{display:inline-block;margin-top:16px}.facts{grid-template-columns:1fr}.person{grid-template-columns:1fr}}@media print{.hint,.hero-print-btn{display:none}.layout{display:block}.panel{box-shadow:none;margin-bottom:14px}.detail{display:block!important;break-inside:avoid}.empty{display:none!important}@page{size:A4 landscape;margin:12mm}}
</style>
<style id="vitality-green-theme">:root{--accent:#16A34A}.hero,.report-hero{background:linear-gradient(135deg,#0F2A1C 0%,#166534 62%,#16A34A 100%)!important}.sub,.report-sub{color:#DCFCE7!important}tbody tr.active{background:#F0FDF4!important}</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div><div class="kicker">RECMA - Hong Kong - Qualitative Evaluation</div><h1>Top Management</h1><p class="sub">T40 - CEO & Heads of Expertise</p></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button class="hero-print-btn" type="button" onclick="window.print()">Print / PDF</button><div class="hint">Click agencies to select / deselect</div></div>
  </section>
  <section class="layout report-interactive">
    <div class="panel"><div class="panel-head"><h2>Agency ranking</h2><p>Extracted from the T40 Top Management PDF.</p></div><table><thead><tr><th>#</th><th>Agency</th><th>Total</th><th>RECMA Points</th><th></th></tr></thead><tbody id="leadershipRanking"></tbody></table></div>
    <div class="panel" id="leadershipDetails"></div>
  </section>
</main>
<script>
const DETAILS={
publicis:[['Tom Kao','CEO HK','July-18','Proven Stability +2 pts'],['Lawrence Yang','CEO Media','May-21','Not assessed'],['Caterina Camerata Scovazzo','Head of Strategy','January-22','Recruitment +2 pts'],['Prachi Karan','Head of Performance','June-23','Not assessed'],['Lars Maehler','Head of SEO / Content','January-24','Recruitment +2 pts'],['Tammii Pang','Managing Director, PMX','August-24','Not assessed'],['Serina Tsou','General Manager, Greater Bay Area','January-24','Not assessed'],['Shirely Lau','Managing Director','January-18','Proven Stability +4 pts'],['Sharon Lau','General Manager','February-21','Stability +2 pts'],['Rav Ho','Associate Digital Director','March-22','Not assessed'],['Becky Lai','Performance Lead','July-22','Not assessed'],['Antony Lau','Digital Director','August-24','Recruitment +2 pts'],['Rebecca Ng','APEC Client lead','October-21','Not assessed'],['Yvonne Lau','Managing Director','January-24','Recruitment +4 pts'],['Kwok Yue Enders Liu','Group Business Director','August-23','Recruitment +2 pts'],['Kat Chan','Business Director','June-22','Not assessed'],['Tammy Tam','Business Director','July-22','Not assessed'],['Annie Lau','Business Director','July-22','Not assessed']],
dentsu:[['Simone Tam','CEO, Greater Bay Area and Hong Kong','January 2021','Stability +4 pts'],['Jeffry Gamble','Chief Creative Officer, Greater Bay Area and Hong Kong','January 2021','Not assessed'],['Wai-Chung Au','Managing Director, Media','June-21','Proven stability +2 pts'],['Shiggy File','Chief Strategy Officer','January-20','Stability +2 pts'],['Toyohiro Bando','Chief Solution Officer','November-21','Not assessed'],['Tom Wan','CEO, GBA Solutions','February-23','Not assessed'],['Keith Fong','Head of Performance','June-22','Not assessed'],['David Chan','Head of Trading and Partnership','August-21','Not assessed'],['Ashley Yeung','Programmatic Director','November-21','Intermediary +0 pt'],['Jan Lee','Managing Partner & Director of dentsu Entertainment','July-24','Not assessed'],['Cherry Choy','Business Director','July-23','Intermediary +0 pt'],['Kimmy Lee','Associate Planning Director','March-24','Not assessed'],['Naomi Chan','Business Director','March-21','Not assessed'],['Polly Ip','Business Director','June-19','Not assessed'],['Christa Ma','Business Director','September-21','Stability +2 pts'],['Ingrid Lee','Associate Planning Director','July-23','Not assessed'],['Nicholas Siu','Associate Media Director','January-22','Not assessed'],['Natalie Chan','Business Director','August-17','Proven Stability +2 pts']],
havas:[['Karl Wu','CEO Greater China','October-16','Proven stability +2 pts'],['Raymond Wong','CFO Greater China','May-01','Not assessed'],['Andrew Cawte','CEO','February-16','Proven stability +4 pts'],['Charlie Clack','General Manager','May-17','Proven stability +2 pts'],['Fonde Lau','Head of Investment','August-16','Stability +2 pts'],['Louis Ng','Head of Programmatic','April-16','Stability +2 pts'],['Jack Lambert','Head of Social','August-19','Stability +2 pts'],['Tracy Lui','Head of Strategy','May-22','Intermediary +0 pt'],['Alex Brazendale','Head of Havas Play','January-23','Not assessed'],['Celine Nikolakopoulou','Regional Business Director','January-24','Not assessed'],['Melody Chan','Business Director Digital','July-24','Not assessed'],['Hody Chan','Regional Account Director','April-21','Not assessed'],['Jabe Yau','Head of HR','June-00','Not assessed'],['Connie Chan','Head of Finance','December-16','Not assessed']],
mediabrands:[['Melinda Po','Greater China CEO','May-22','Intermediary +0 pt'],['Crystal Zhang','CFO Mediabrands Greater China','Feb-23','Not assessed'],['Penny Chow','COO Mediabrands Greater China','Jun-25','Not assessed'],['Grace Tang','Group Director, Growth and Strategy','Jan-23','Intermediary +0 pt'],['Dorothy Poon','Digital Director','July-25','Recruitment +2 pts'],['Jay Lee','Executive Creative Director, MBCS Greater China','May-21','Stability +2 pts']],
groupm:[['Alice Chow','CEO GroupM HK','March-14','Proven stability +2 pts'],['Kenny Ip','Trading Director','01/01/2021','Not assessed'],['Milton Liao','Managing Director','Apr-23','Recruitment +4 pts'],['Scotty Ho','Managing Partner','Nov-22','Not assessed'],['Kenix Lai','Managing Partner','Nov-22','Not assessed'],['Silas Ho','Managing Director','October-21','Intermediary +0 pt'],['Anthony Lau','Managing Partner','October-21','Intermediary +0 pt'],['Karen Vera','Head of Content','May-22','Intermediary +2 pts'],['Anthony Tsui','Head of Data','November-21','Intermediary +0 pt'],['Irene Tsui','Managing Director','March-22','Intermediary +0 pt'],['Brandon Cheung','Performance Director','April-15','Proven stability +2 pts'],['Chung Tong','Head of Digital','August-14','Proven stability +2 pts']]
};
const LEADERSHIP_DATA=[
{id:'havas',rank:'1=',agency:'Havas Media',group:'Havas Media Network',color:'#DCB9FF',ink:'#6B2FA6',value:'+14 pts',score:1,components:['+2 pts','+4 pts','+8 pts'],details:DETAILS.havas,active:true},
{id:'starcom',rank:'1=',agency:'Starcom',group:'Publicis Media',color:'#FFEADD',ink:'#8C3A13',value:'+14 pts',score:1,components:['+2 pts','+4 pts','+8 pts'],details:DETAILS.publicis},
{id:'zenith',rank:'3',agency:'Zenith',group:'Publicis Media',color:'#FFEADD',ink:'#8C3A13',value:'+12 pts',score:1,components:['+2 pts','+4 pts','+6 pts'],details:DETAILS.publicis},
{id:'omd',rank:'4',agency:'OMD',group:'Omnicom Media',color:'#FFE699',ink:'#5F4500',value:'+10 pts',score:0,components:['+2 pts','+4 pts','+4 pts'],details:[]},
{id:'dentsux',rank:'5=',agency:'dentsu X',group:'dentsu',color:'#E2F0D9',ink:'#3F6F2D',value:'+8 pts',score:0,components:['+6 pts','+0 pt','+2 pts'],details:DETAILS.dentsu},
{id:'iprospect',rank:'5=',agency:'iProspect',group:'dentsu',color:'#E2F0D9',ink:'#3F6F2D',value:'+8 pts',score:1,components:['+6 pts','+0 pt','+2 pts'],details:DETAILS.dentsu},
{id:'phd',rank:'5=',agency:'PHD',group:'Omnicom Media',color:'#FFE699',ink:'#5F4500',value:'+8 pts',score:1,components:['+2 pts','+0 pt','+6 pts'],details:[]},
{id:'carat',rank:'8=',agency:'Carat',group:'dentsu',color:'#E2F0D9',ink:'#3F6F2D',value:'+6 pts',score:0,components:['+6 pts','+0 pt','+0 pt'],details:DETAILS.dentsu},
{id:'mindshare',rank:'8=',agency:'Mindshare',group:'WPP Media',color:'#FFE4FF',ink:'#7A237A',value:'+6 pts',score:1,components:['+2 pts','+0 pt','+4 pts'],details:DETAILS.groupm},
{id:'wavemaker',rank:'8=',agency:'Wavemaker',group:'WPP Media',color:'#FFE4FF',ink:'#7A237A',value:'+6 pts',score:1,components:['+2 pts','+4 pts','+0 pt'],details:DETAILS.groupm},
{id:'spark',rank:'8=',agency:'Spark Foundry',group:'Publicis Media',color:'#FFEADD',ink:'#8C3A13',value:'+6 pts',score:0,components:['n.a.','n.a.','n.a.'],details:DETAILS.publicis,note:'Spark Foundry is not listed in the extracted T40 summary table; the +6 pts value comes from the existing overview data.'},
{id:'hearts',rank:'12=',agency:'Hearts & Science',group:'Omnicom Media',color:'#FFE699',ink:'#5F4500',value:'+4 pts',score:0,components:['+2 pts','+0 pt','+2 pts'],details:[]},
{id:'um',rank:'12=',agency:'UM incl. Initiative',group:'Mediabrands',color:'#FFE699',ink:'#5F4500',value:'+4 pts',score:0,components:['+0 pt','+0 pt','+4 pts'],details:DETAILS.mediabrands},
{id:'em',rank:'14',agency:'EssenceMediacom',group:'WPP Media',color:'#FFE4FF',ink:'#7A237A',value:'+2 pts',score:0,components:['+2 pts','+0 pt','+0 pt'],details:DETAILS.groupm}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pointLabel=score=>score===null?'n.a':(score>0?'+':'')+score+' pt'+(Math.abs(score)===1?'':'s');
const pointClass=score=>score>0?'mid':'none';
const peopleHtml=item=>item.details&&item.details.length?`<div class="people"><h4>Extracted leadership details</h4><div class="people-list">${item.details.map(p=>`<div class="person"><b>${esc(p[0])}</b><span>${esc(p[1])}</span><em>${esc(p[2])}</em><span>${esc(p[3])}</span></div>`).join('')}</div></div>`:`<div class="people"><h4>Extracted leadership details</h4><p style="margin:0;color:#6B7280;font-size:12px">No agency-specific people table was extracted for this agency; only the T40 summary scoring is available in the PDF text.</p></div>`;
document.getElementById('leadershipRanking').innerHTML=LEADERSHIP_DATA.map(item=>`<tr class="${item.active?'active':''}" data-target="${esc(item.id)}"><td>${esc(item.rank)}</td><td><span class="agency-cell"><span class="dot" style="background:${esc(item.color)}"></span><span>${esc(item.agency)}<span class="group">${esc(item.group)}</span></span></span></td><td class="num" style="color:${esc(item.ink)}">${esc(item.value)}</td><td><span class="pts ${pointClass(item.score)}">${pointLabel(item.score)}</span></td><td class="chev">&rsaquo;</td></tr>`).join('');
document.getElementById('leadershipDetails').innerHTML=LEADERSHIP_DATA.map(item=>`<div class="detail ${item.active?'active':''}" id="${esc(item.id)}"><div class="detail-hero"><div class="detail-title"><span class="dot big" style="background:${esc(item.color)}"></span><div><h3 style="color:${esc(item.ink)}">${esc(item.agency)}</h3><small>${esc(item.group)}</small></div></div><div class="detail-count"><b style="color:${esc(item.ink)}">${esc(item.value)}</b><span>Leadership indicator</span></div></div><div class="facts"><div class="fact"><span>Group points</span><b>${esc(item.components[0])}</b></div><div class="fact"><span>CEO double points</span><b>${esc(item.components[1])}</b></div><div class="fact"><span>Other staff pts</span><b>${esc(item.components[2])}</b></div><div class="fact"><span>RECMA Points</span><b>${pointLabel(item.score)}</b></div></div>${item.note?`<div class="pdf-note">${esc(item.note)}</div>`:''}${peopleHtml(item)}</div>`).join('') + '<div class="empty">No agency selected. Click one or more rows to display details.</div>';
(function(){const rows=[...document.querySelectorAll('tbody tr[data-target]')];const details=[...document.querySelectorAll('.detail[id]')];const empty=document.querySelector('.empty');function sync(){const active=rows.filter(r=>r.classList.contains('active')).map(r=>r.dataset.target);details.forEach(d=>d.classList.toggle('active',active.includes(d.id)));if(empty)empty.classList.toggle('active',active.length===0)}rows.forEach(row=>row.addEventListener('click',()=>{row.classList.toggle('active');sync()}));sync()}());
</script>
</body>
</html>
